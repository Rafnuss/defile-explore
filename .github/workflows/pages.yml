name: Explore viewer

# The build takes 30-40 min on a runner, so it runs locally: scripts/publish_explore.py uploads
# viewer.zip to a release and starts this workflow, which only deploys it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release whose viewer.zip to deploy
        default: dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download the viewer of a local build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p viewer.zip
          unzip -q viewer.zip -d site
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the viewer
        id: deployment
        uses: actions/deploy-pages@v4
