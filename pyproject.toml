[project]
name = "defile-explore"
version = "0.1.0"
description = "Statistics behind defileViz's Explore page: trends, phenology and passage of migrating birds at Défilé de l'Écluse"
requires-python = ">=3.11,<3.12"

# Exact pins, the versions defile-migration-forecast and defile-dataset use, so the release is read
# the same way in every repo. Bump deliberately.
dependencies = [
    "numpy==1.26.4",
    "pandas==2.3.3",
    "scipy==1.16.3",
    "pygam==0.12.0",
    "suncalc==0.1.3",
    "matplotlib==3.10.3",
    "plotly==6.3.1",
    "pytest==9.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defile_explore"]

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
line_length = 99

[tool.pytest.ini_options]
testpaths = ["tests"]
